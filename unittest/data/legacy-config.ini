[MovieID]
ignore_whole_word = 144P;240P;360P;480P;720P;1080P;2K;4K
ignore_regex = \w+2048\.com;Carib(beancom)?;[^a-z\d](f?hd|lt)[^a-z\d]

[File]
scan_dir = C:\legacy\incoming
media_ext = 3gp;avi;f4v;flv;iso;m2ts;m4v;mkv;mov;mp4;mpeg;rm;rmvb;ts;vob;webm;wmv;strm;mpg
ignore_folder = #recycle;#整理完成;不要扫描;ready
ignore_video_file_less_than = 232
enable_file_move = yes

[Network]
use_proxy = yes
proxy = http://127.0.0.1:7897
retry = 1
timeout = 5

[CrawlerSelect]
normal = airav,avsox,javbus,javdb,javlib,jav321,mgstage,prestige
fc2 = fc2,avsox,javdb,javmenu,fc2ppvdb
cid = fanza
getchu = dl_getchu
gyutto = gyutto

[Crawler]
required_keys = cover,title
hardworking_mode = yes
respect_site_avid = yes
fc2fan_local_path =
title__remove_actor = yes
title__chinese_first = yes
sleep_after_scraping = 1
ignore_javdb_cover = auto
unify_actress_name = yes

[ProxyFree]
avsox = https://avsox.click
javdb = https://javdb368.com
javbus = https://www.seedmm.help
javlib = https://www.y78k.com

[NamingRule]
media_servers = universal
output_folder = ready
save_dir = $censor/[$num] $title
filename = $num
max_path_len = 150
calc_path_len_by_byte = auto
max_actress_count = 10
nfo_title = $num $title
text_for_censored = 有码
text_for_uncensored = 无码
text_for_unknown_censorship = 打码情况未知
null_for_title = #未知标题
null_for_actress = #未知女优
null_for_serial = #未知系列
null_for_director = #未知导演
null_for_producer = #未知制作商
null_for_publisher = #未知发行商

[Picture]
use_big_cover = yes
use_ai_crop = no
use_ai_crop_labels = \d,ARA,SIRO,GANA,MIUM
ai_engine =
aip_appid =
aip_api_key =
aip_secret_key =
add_label_to_cover = no

[Translate]
engine = baidu
translate_title = yes
translate_plot = yes
baidu_appid = test-baidu_appid
baidu_key = test-baidu_key
bing_key =
claude_key =
groq_key =

[NFO]
add_custom_genres = yes
add_custom_genres_fields = $genre,$censor
add_custom_tags = yes
add_custom_tags_fields = $genre,$censor

[Other]
check_update = yes
auto_update = yes
auto_exit = false
